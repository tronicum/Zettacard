# CI for Zettacard.
#
# WHY THIS EXISTS, AND WHY IT RUNS A BROWSER
#
# The worst bug this project has shipped was invisible to three passing
# automated passes: after switching language, nothing was clickable for every
# non-German locale, because the language <select> lives inside #app-menu and
# changing it left the menu open with setInertBehindDialog(true) still
# applied. A human found it in seconds. So every suite below drives the app
# through the controls a person actually clicks, and asserts the inert state
# afterwards - see the header of scripts/test_user_journeys.mjs.
#
# It also exists because a browser could not be run reliably anywhere else.
# The Cowork workspace VM has no sudo, so `playwright install --with-deps`
# cannot install libxdamage1 and friends there; a GitHub runner can, which is
# what makes this the right home for these checks rather than a laptop.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium (with system deps)
        run: npx playwright install --with-deps chromium chromium-headless-shell

      # --- data ---------------------------------------------------------
      # Pure stdlib, no pip install needed.

      - name: Data integrity
        run: npm run check:data

      - name: Deploy preflight
        run: python3 scripts/check_deploy_preflight.py

      # The single most valuable check here. app/data/** is GENERATED from
      # data/*.json by build_modules.py, and netlify.toml runs that same
      # script at deploy time - so if a rebuild does not reproduce what is
      # committed, the site Netlify publishes is not the site anyone
      # reviewed. That is silent by nature; this makes it loud.
      # The exam/material version split (ADR-app-0003 s 3) is only worth
      # something if the invariant actually holds - a split nobody verifies is
      # two hex strings drifting apart in silence.
      - name: Module version invariants
        run: python3 scripts/test_module_versions.py

      - name: Generated output is reproducible
        run: |
          python3 data/build_modules.py > /dev/null
          # --porcelain, not `git diff`: adding a locale CREATES files rather
          # than modifying them (16 course_locales/*.json appeared this way in
          # roadmap 3.4), and `git diff` does not see untracked files at all.
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Rebuilding from source changed the working tree."
            echo "Run 'python3 data/build_modules.py' and commit the result."
            git --no-pager status --short
            git --no-pager diff --stat
            exit 1
          fi
          echo "Rebuild reproduces committed output exactly."

      # --- browser ------------------------------------------------------

      - name: Start the app
        run: |
          node scripts/serve-app.mjs 8802 &
          for i in $(seq 1 30); do
            curl -sf -o /dev/null http://localhost:8802/app.html && break
            sleep 1
          done
          curl -sf -o /dev/null http://localhost:8802/app.html

      - name: Module hub (ADR-app-0002 § 1)
        run: npm run test:hub

      - name: Topic split (roadmap 3.3)
        run: npm run test:topics

      - name: Traffic light (roadmap 3.2)
        run: npm run test:light

      - name: Derived lessons (roadmap 3.4)
        run: npm run test:lessons

      - name: UI strings from the KB (roadmap 3.7)
        run: npm run test:ui

      - name: The hub resumes (ADR-app-0002 § 1)
        run: npm run test:resume

      - name: The learning path (topic row opens the lesson)
        run: npm run test:path

      - name: Landing-page module links resolve
        run: npm run test:links

      - name: Desktop and landscape share the content column
        run: npm run test:desktop

      - name: German is spelled with umlauts
        run: npm run check:orthography

      # DEF-0003/0004/0005. Not a truth check - it cannot know where the
      # questions came from, and for four modules nobody does yet. It only
      # stops the claim reappearing while that is open.
      - name: No unestablished origin claims in learner-facing copy
        run: npm run check:claims

      - name: The simulation runs in a real exam language (ADR-app-0002 § 5)
        run: npm run test:examlang

      - name: The next action defaults per module kind (roadmap 4.1)
        run: npm run test:kind

      # Blocking, with a caveat that belongs in the job name as much as in the
      # file: automated tooling catches a minority of WCAG failures. Green here
      # means no KNOWN machine-detectable violation, not that the app is usable
      # with a screen reader. That still needs a person.
      - name: No machine-detectable accessibility violations
        run: npm run test:a11y

      - name: Cold start reaches content in 4 taps (fable's check #1)
        run: npm run test:coldstart

      # NOT blocking, and deliberately so. This suite currently reports
      # "HEADER, MAIN left inert" after nearly every step, which is CORRECT
      # behaviour being asserted at the wrong moment: it calls
      # assertAppIsUsable() while a modal view is still open. Verified by
      # A/B against a clean checkout - both builds report identically.
      #
      # It is not silenced and it is not "fixed" by relaxing the assertion,
      # because an inert assertion is exactly what would have caught the
      # language-switch bug. It runs, its output is visible, and it stops
      # blocking the moment someone moves those assertion points to after
      # the view closes.
      - name: User journeys (non-blocking - see comment)
        continue-on-error: true
        run: npm run test:journeys

      # Same treatment, different reason: the translation ledger reports 22
      # stale and 8658 untracked entries. That is a content backlog in
      # zettacard-kb, not a regression in this repo, and blocking every PR
      # on it would train everyone to ignore a red X.
      - name: Translation ledger (non-blocking - content backlog)
        continue-on-error: true
        run: npm run check:translations
