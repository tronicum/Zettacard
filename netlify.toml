[functions]
  # DN-signing: netlify/functions/sign-credential.js signs completion
  # records as JWT credentials (see docs/open-badges-signing-scoping.md
  # and docs/open-badges-signing-setup.md). Requires the
  # ZETTACARD_SIGNING_PRIVATE_JWK env var to be set in the Netlify UI -
  # never committed here. package.json at repo root exists solely so the
  # function bundler can resolve/bundle its "jose" dependency.
  directory = "netlify/functions"

[build]
  # No build step from Netlify's perspective - app/ is a flat static PWA.
  # The data/ tree under app/ IS a build artifact, but it's generated ahead
  # of time by data/build_modules.py (run from the repo root, not by
  # Netlify) since it derives from the editable master content files, not
  # from anything Netlify needs to compile. Publish app/ as-is.
  publish = "app"
  command = "true"

[[headers]]
  for = "/service-worker.js"
  [headers.values]
    # Never let a CDN/browser cache the service worker itself - it needs to
    # be re-fetched on every load so updates (new CACHE_NAME) actually take
    # effect instead of being stuck on a stale cached worker indefinitely.
    Cache-Control = "no-cache"

[[headers]]
  for = "/data/*"
  [headers.values]
    # DN-39: content lives under data/<exam_type>/{core.json,locales/*.json}
    # + data/modules.json, not one flat data.json. All of it changes with
    # every content round (versioned via each module's meta.version) - keep
    # it revalidating rather than aggressively cached, since the service
    # worker's own runtime cache already handles offline use per visitor.
    Cache-Control = "no-cache"

[[headers]]
  for = "/assets/*"
  [headers.values]
    # Sign/diagram SVGs are content-addressed by filename, not hashed, but
    # change rarely - a short cache is a reasonable middle ground.
    Cache-Control = "public, max-age=3600"

# Redirects (including the /verify/* -> verify-credential-v2 function rule
# and the SPA/marketing-page catch-all) now live in app/_redirects, not
# here. netlify.toml redirects take precedence over an _redirects file
# when both exist, and the second [[redirects]] block that used to be
# here was silently never applied in production (confirmed by curling a
# fresh /verify/<slug> and getting the landing page instead of the
# function's output, even with force=true) - moving both rules to
# app/_redirects sidesteps whatever was dropping it. See that file for
# the actual rules and their comments.
