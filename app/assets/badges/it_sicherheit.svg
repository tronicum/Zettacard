<!--
  Zettacard module-achievement badge image: IT-Sicherheit am Arbeitsplatz.
  Same frame system as datenschutz.svg (2026-09-03). Teal ring; glyph =
  padlock over a simple laptop/rectangle outline.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="IT-Sicherheit am Arbeitsplatz Grundlagenzertifikat">
  <rect x="4" y="4" width="192" height="192" rx="28" fill="#0b1220"/>
  <rect x="4" y="4" width="192" height="192" rx="28" fill="none" stroke="#14b8a6" stroke-width="10"/>
  <rect x="20" y="20" width="160" height="160" rx="20" fill="none" stroke="#1a6e64" stroke-width="1.5"/>
  <!-- laptop outline -->
  <rect x="66" y="88" width="68" height="42" rx="4" fill="none" stroke="#eef1f8" stroke-width="5"/>
  <path d="M54 142 L146 142 L136 130 L64 130 Z" fill="#eef1f8"/>
  <!-- padlock over the laptop -->
  <rect x="88" y="112" width="24" height="20" rx="3" fill="#14b8a6"/>
  <path d="M92 112 V104 a8 8 0 0 1 16 0 V112" fill="none" stroke="#14b8a6" stroke-width="5"/>
  <circle cx="100" cy="121" r="3" fill="#0b1220"/>
