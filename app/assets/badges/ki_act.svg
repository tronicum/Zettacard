<!--
  Zettacard module-achievement badge image: EU KI-Verordnung (AI Act).
  Same frame system as datenschutz.svg (2026-09-03). Violet ring; glyph =
  a simple node/network graph (4 connected dots) inside a partial
  circular arc, suggesting the EU-stars motif abstractly (deliberately
  NOT a literal EU flag/stars reproduction).
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="EU KI-Verordnung AI Act Grundlagenzertifikat">
  <rect x="4" y="4" width="192" height="192" rx="28" fill="#0b1220"/>
  <rect x="4" y="4" width="192" height="192" rx="28" fill="none" stroke="#7c3aed" stroke-width="10"/>
  <rect x="20" y="20" width="160" height="160" rx="20" fill="none" stroke="#4c2a86" stroke-width="1.5"/>
  <!-- partial circular arc, abstractly evoking the EU-stars motif -->
  <path d="M100 52 A48 48 0 1 1 55 128" fill="none" stroke="#7c3aed" stroke-width="4" stroke-dasharray="3 9" stroke-linecap="round"/>
  <!-- node/network graph -->
  <line x1="78" y1="86" x2="122" y2="86" stroke="#eef1f8" stroke-width="4"/>
  <line x1="78" y1="86" x2="100" y2="122" stroke="#eef1f8" stroke-width="4"/>
  <line x1="122" y1="86" x2="100" y2="122" stroke="#eef1f8" stroke-width="4"/>
  <line x1="122" y1="86" x2="132" y2="118" stroke="#eef1f8" stroke-width="4"/>
  <circle cx="78" cy="86" r="9" fill="#eef1f8"/>
  <circle cx="122" cy="86" r="9" fill="#eef1f8"/>
  <circle cx="100" cy="122" r="9" fill="#eef1f8"/>
  <circle cx="132" cy="118" r="7" fill="#eef1f8"/>
</svg>
