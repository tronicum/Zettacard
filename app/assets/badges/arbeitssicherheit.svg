<!--
  Zettacard module-achievement badge image: Arbeitssicherheit & Arbeitsschutz.
  Same frame system as datenschutz.svg (2026-09-03). Signal-orange ring;
  glyph = hard-hat/helmet outline over two crossed lines (safety-marker
  motif).
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Arbeitssicherheit und Arbeitsschutz Grundlagenzertifikat">
  <rect x="4" y="4" width="192" height="192" rx="28" fill="#0b1220"/>
  <rect x="4" y="4" width="192" height="192" rx="28" fill="none" stroke="#e07a1f" stroke-width="10"/>
  <rect x="20" y="20" width="160" height="160" rx="20" fill="none" stroke="#86592c" stroke-width="1.5"/>
  <!-- crossed safety-marker lines behind the helmet -->
  <line x1="62" y1="120" x2="138" y2="150" stroke="#e07a1f" stroke-width="6" stroke-linecap="round"/>
  <line x1="138" y1="120" x2="62" y2="150" stroke="#e07a1f" stroke-width="6" stroke-linecap="round"/>
  <!-- hard-hat outline -->
  <path d="M62 108
           C62 82 80 64 100 64
           C120 64 138 82 138 108
           Z"
        fill="none" stroke="#eef1f8" stroke-width="6" stroke-linejoin="round"/>
  <rect x="54" y="106" width="92" height="12" rx="6" fill="#eef1f8"/>
  <line x1="100" y1="64" x2="100" y2="106" stroke="#0b1220" stroke-width="4"/>
</svg>
