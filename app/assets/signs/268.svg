<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img">

  <circle cx="50" cy="50" r="46" fill="#0058a3"/>
  <!-- tyre -->
  <circle cx="50" cy="50" r="30" fill="none" stroke="#fff" stroke-width="6"/>
  <!-- rim -->
  <circle cx="50" cy="50" r="11" fill="none" stroke="#fff" stroke-width="4"/>
  <!-- chain links across the tread, evenly spaced around the tyre -->
  <g stroke="#fff" stroke-width="5" stroke-linecap="round">
    <line x1="50" y1="18" x2="50" y2="30" />
    <line x1="76.6" y1="34" x2="66.2" y2="40" />
    <line x1="76.6" y1="66" x2="66.2" y2="60" />
    <line x1="50" y1="82" x2="50" y2="70" />
    <line x1="23.4" y1="66" x2="33.8" y2="60" />
    <line x1="23.4" y1="34" x2="33.8" y2="40" />
  </g>

</svg>
