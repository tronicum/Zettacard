<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Zettacard — Lernkarten & Prüfungsvorbereitung</title>
  <meta name="description" content="Original practice questions for driving licences, fishing licences, and workplace compliance training, in 12 languages. Free, works offline, installable as an app. Not an exam simulator." />
  <meta name="theme-color" content="#0b1220" />
  <link rel="icon" type="image/svg+xml" href="icons/logo.svg" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <!-- This is a marketing landing page, not the app itself - it deliberately
       does NOT link manifest.json or attempt a PWA install prompt (that's
       app.html's job, since manifest.json's start_url now points there).
       A visitor who has already installed the app never sees this page
       again anyway (their home-screen icon launches straight into
       app.html). See netlify.toml/service-worker.js comments for how the
       two files' roles were split during the Zettacard rebrand.

       2026-08-06: extended from a DE/EN-only toggle to all 12 of the app's
       languages (LANDING_STRINGS below), on explicit request, since the
       earlier DE/EN-only scoping read as a real gap once the rest of the
       app had full 12-locale coverage. Deliberately still self-contained -
       no dependency on app.js's i18n machinery or on fetching modules.json
       at runtime - module names/subtitles below are copied verbatim from
       the already-translated, already-verified app/data/modules.json
       (not re-translated from scratch) so this page can't drift out of
       sync with the app's own wording for those particular strings. -->
  <link rel="stylesheet" href="styles.css" />
  <script>
    // Same theme-flash-prevention approach as app.html (same key,
    // "dn-theme," same styles.css tokens) - kept here too, even though this
    // page never shows an install prompt, because the landing page reuses
    // the app's exact visual system and should honor the same saved
    // light/dark preference without its own flash of the wrong theme.
    (function () {
      try {
        var saved = localStorage.getItem("dn-theme");
        var theme = saved || (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
        document.documentElement.setAttribute("data-theme", theme);
      } catch (e) { /* storage/matchMedia unavailable - default dark styling still applies */ }
    })();
  </script>
  <style>
    /* Landing-page-only layout. Colors/typography intentionally come from
       styles.css's existing tokens (loaded above) so this page looks like
       the same product as app.html, not a different design language - only
       structure/spacing rules specific to this page's sections live here. */
    .hero {
      max-width: 720px;
      margin: 0 auto;
      padding: 48px 20px 24px;
      text-align: center;
    }
    .hero-logo {
      width: 96px;
      height: 96px;
      margin: 0 auto 20px;
      display: block;
      border-radius: var(--radius);
    }
    .hero h1 {
      font-size: 2rem;
      margin: 0 0 10px;
      letter-spacing: -0.02em;
    }
    .hero p.lede {
      color: var(--text-dim);
      font-size: 1.05rem;
      line-height: 1.5;
      max-width: 560px;
      margin: 0 auto 28px;
    }
    .cta-row {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 8px;
    }
    .cta-btn {
      display: inline-block;
      background: var(--accent);
      color: #fff;
      font-weight: 700;
      font-size: 1rem;
      text-decoration: none;
      padding: 14px 28px;
      border-radius: 999px;
      min-height: 44px;
      line-height: 1.6;
    }
    .cta-btn:hover, .cta-btn:focus-visible { filter: brightness(1.08); }
    .lang-toggle {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 6px;
      margin-bottom: 8px;
    }
    /* Reuses the exact same "🌐 icon + native-endonym <select>" pattern as
       app.html's own language pickers (lang-select-wrap/lang-icon/
       lang-select classes, styled by the shared styles.css), so this page's
       picker looks and behaves identically to the app's - not a bespoke
       second design for the same concept. */
    .lang-select-wrap select {
      min-width: 160px;
    }
    .features {
      max-width: 720px;
      margin: 0 auto;
      padding: 8px 20px 8px;
    }
    .features ul {
      list-style: none;
      margin: 0;
      padding: 0;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 10px;
    }
    .features li {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px 14px;
      font-size: 0.88rem;
    }
    .modules {
      max-width: 720px;
      margin: 0 auto;
      padding: 32px 20px 56px;
    }
    .modules h2 {
      font-size: 1.15rem;
      margin: 0 0 14px;
      text-align: center;
    }
    .module-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 10px;
    }
    .module-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 16px;
      font-size: 0.9rem;
    }
    .module-card strong { display: block; margin-bottom: 2px; }
    .module-card span { color: var(--text-dim); font-size: 0.8rem; }
    footer.landing-footer {
      text-align: center;
      color: var(--text-dim);
      font-size: 0.78rem;
      padding: 0 20px 40px;
    }
  </style>
</head>

    <section class="features">

    </section>

    <section class="modules">

  </main>

  <footer class="landing-footer" id="landing-footer"></footer>

        zh: { lede:"为驾驶执照、摩托车和卡车驾照、钓鱼证以及职场合规培训主题(数据保护、职业安全、人工智能法案、IT安全)提供的原创练习题——支持12种语言,完全免费,可离线使用,并可作为应用安装。", cta:"立即开始", feats:["✅ 原创题目","🌐 12种语言","📶 离线可用","🆓 免费"], modulesHeading:"8个模块", theoryExam:"理论考试", compliance:"职场合规培训", footer:"Zettacard 不是官方考试模拟器。原创学习内容,CC BY-NC-SA 4.0。", langLabel:"语言" },
        hi: { lede:"ड्राइविंग लाइसेंस, मोटरसाइकिल और ट्रक लाइसेंस, मछली पकड़ने के लाइसेंस, और कार्यस्थल अनुपालन विषयों (डेटा सुरक्षा, व्यावसायिक सुरक्षा, एआई अधिनियम, आईटी सुरक्षा) के लिए मौलिक अभ्यास प्रश्न — 12 भाषाओं में, पूरी तरह मुफ़्त, ऑफ़लाइन काम करता है और ऐप के रूप में इंस्टॉल किया जा सकता है।", cta:"अभी शुरू करें", feats:["✅ मौलिक प्रश्न","🌐 12 भाषाएँ","📶 ऑफ़लाइन काम करता है","🆓 मुफ़्त"], modulesHeading:"8 मॉड्यूल", theoryExam:"सैद्धांतिक परीक्षा", compliance:"कार्यस्थल अनुपालन प्रशिक्षण", footer:"Zettacard कोई आधिकारिक परीक्षा सिम्युलेटर नहीं है। मौलिक शिक्षण सामग्री, CC BY-NC-SA 4.0।", langLabel:"भाषा" },

        ru: { lede:"Оригинальные тренировочные вопросы для водительских прав, прав на мотоцикл и грузовик, удостоверения рыболова и тем обязательного обучения на рабочем месте (защита данных, охрана труда, закон об ИИ, ИТ-безопасность) — на 12 языках, полностью бесплатно, работает офлайн и устанавливается как приложение.", cta:"Начать сейчас", feats:["✅ Оригинальные вопросы","🌐 12 языков","📶 Работает офлайн","🆓 Бесплатно"], modulesHeading:"8 модулей", theoryExam:"Теоретический экзамен", compliance:"Обязательное обучение на работе", footer:"Zettacard не является официальным симулятором экзамена. Оригинальный учебный контент, CC BY-NC-SA 4.0.", langLabel:"Язык" },

        it: { lede:"Domande di esercizio originali per la patente di guida, le patenti per moto e camion, la licenza di pesca e i temi di conformità aziendale (protezione dei dati, sicurezza sul lavoro, la Legge sull'IA, sicurezza IT) — in 12 lingue, completamente gratuito, funziona offline e si installa come app.", cta:"Inizia ora", feats:["✅ Domande originali","🌐 12 lingue","📶 Funziona offline","🆓 Gratuito"], modulesHeading:"8 moduli", theoryExam:"Esame teorico", compliance:"Formazione aziendale obbligatoria", footer:"Zettacard non è un simulatore d'esame ufficiale. Contenuti didattici originali, CC BY-NC-SA 4.0.", langLabel:"Lingua" }
      };

      var LOCALES = ["de","en","uk","pl","ar","zh","hi","tr","fr","ru","es","it"];
      var RTL_LOCALES = { ar: true };
      var STORAGE_KEY = "dn-landing-lang";

      function detectLang() {
        try {
          var saved = localStorage.getItem(STORAGE_KEY);
          if (saved && LANDING_STRINGS[saved]) return saved;
        } catch (e) { /* storage unavailable, fall through to browser detection */ }
        var nav = (navigator.language || "de").slice(0, 2).toLowerCase();
        return LANDING_STRINGS[nav] ? nav : "de";
      }

      function render(lang) {
        var s = LANDING_STRINGS[lang] || LANDING_STRINGS.de;
        document.documentElement.setAttribute("lang", lang);
        document.documentElement.setAttribute("dir", RTL_LOCALES[lang] ? "rtl" : "ltr");
        document.getElementById("lede").textContent = s.lede;
        document.getElementById("cta-btn").textContent = s.cta;
        document.getElementById("modules-heading").textContent = s.modulesHeading;
        document.getElementById("landing-footer").textContent = s.footer;
        document.querySelector(".lang-toggle").setAttribute("aria-label", s.langLabel);

        var featsEl = document.getElementById("features-list");
        featsEl.innerHTML = "";
        s.feats.forEach(function (f) {
          var li = document.createElement("li");
          li.textContent = f;
          featsEl.appendChild(li);
        });

        var moduleOrder = ["fuehrerschein","motorrad","lkw","angelschein","datenschutz","arbeitssicherheit","ki_act","it_sicherheit"];
        var subtitles = {
          fuehrerschein: CLASS_B[lang] || CLASS_B.en,
          motorrad: s.theoryExam,
          lkw: s.theoryExam,
          arbeitssicherheit: s.compliance,
          it_sicherheit: s.compliance
        };
        var gridEl = document.getElementById("module-grid");
        gridEl.innerHTML = "";
        moduleOrder.forEach(function (mod) {
          var name = (MODULE_LABELS[mod] && (MODULE_LABELS[mod][lang] || MODULE_LABELS[mod].en)) || mod;
          var card = document.createElement("div");
          card.className = "module-card";
          var strong = document.createElement("strong");
          strong.textContent = name;
          card.appendChild(strong);
          if (subtitles[mod]) {
            var span = document.createElement("span");
            span.textContent = subtitles[mod];
            card.appendChild(span);
          }
          gridEl.appendChild(card);
        });

        document.getElementById("lang-select").value = lang;
      }

      var startLang = detectLang();
      render(startLang);

      document.getElementById("lang-select").addEventListener("change", function (e) {
        var lang = e.target.value;
        try { localStorage.setItem(STORAGE_KEY, lang); } catch (e2) { /* storage unavailable, non-fatal */ }
        render(lang);
      });
    })();
  </script>
</body>
</html>
