<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Zettacard — Lernkarten & Prüfungsvorbereitung</title>
  <meta name="description" content="Original practice questions for driving licences, fishing licences, and workplace/enterprise compliance training (incl. KYC/AML and antitrust law), in 12 languages. Free, works offline, installable as an app. Not an official exam simulator." />
  <meta name="theme-color" content="#0b1220" />
  <link rel="icon" type="image/svg+xml" href="icons/logo.svg" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />

  <!-- DN-55: SEO/discoverability pass. canonical points at the apex domain
       (not the netlify.app alias) since zettacard.de is the primary
       production URL as of the custom-domain migration; og:/twitter: tags
       use the German copy as the single static fallback description (this
       page is otherwise fully client-side-i18n'd per LANDING_STRINGS below,
       but crawlers/social-share unfurlers execute no JS, so they only ever
       see whatever is in these static tags - German was chosen as the
       operator's home-market language, matching <html lang="de"> above).
       og-banner.png is a static 1200x630 PNG generated from
       icons/og-banner.svg (same brand colors/logo as the app icon; kept as
       a separate rasterized asset since OG/Twitter unfurlers require a
       real image file, not inline SVG). -->
  <link rel="canonical" href="https://zettacard.de/" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Zettacard" />
  <meta property="og:title" content="Zettacard — Lernkarten & Prüfungsvorbereitung" />
  <meta property="og:description" content="Lernmodule für Führerschein, Motorrad, LKW, Angelschein und betriebliche/unternehmensweite Pflichtthemen (u. a. Datenschutz, KI-Verordnung, Geldwäscheprävention, Kartellrecht) — in 12 Sprachen, kostenlos, offlinefähig, installierbar." />
  <meta property="og:url" content="https://zettacard.de/" />
  <meta property="og:image" content="https://zettacard.de/icons/og-banner.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:locale" content="de_DE" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Zettacard — Lernkarten & Prüfungsvorbereitung" />
  <meta name="twitter:description" content="Lernmodule für Führerschein, Angelschein und betriebliche/unternehmensweite Pflichtthemen — in 12 Sprachen, kostenlos, offlinefähig." />
  <meta name="twitter:image" content="https://zettacard.de/icons/og-banner.png" />
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@graph": [
      {
        "@type": "Organization",
        "@id": "https://zettacard.de/#organization",
        "name": "tronicum networx GmbH",
        "url": "https://zettacard.de/",
        "logo": "https://zettacard.de/icons/icon-512.png",
        "email": "contact@zettacard.de"
      },
      {
        "@type": "WebSite",
        "@id": "https://zettacard.de/#website",
        "url": "https://zettacard.de/",
        "name": "Zettacard",
        "inLanguage": ["de", "en", "uk", "pl", "ar", "zh", "hi", "tr", "fr", "ru", "es", "it"],
        "publisher": { "@id": "https://zettacard.de/#organization" }
      },
      {
        "@type": "SoftwareApplication",
        "name": "Zettacard",
        "applicationCategory": "EducationalApplication",
        "operatingSystem": "Any (installable PWA)",
        "url": "https://zettacard.de/",
        "description": "Original practice questions for driving/motorcycle/truck/fishing licences and workplace/enterprise compliance training (data protection, AI Act, occupational safety, whistleblower protection, KYC/AML, antitrust law), in 12 languages.",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "EUR" },
        "publisher": { "@id": "https://zettacard.de/#organization" }
      }
    ]
  }
  </script>
  <!-- This is a marketing landing page, not the app itself - it deliberately
       does NOT link manifest.json or attempt a PWA install prompt (that's
       app.html's job, since manifest.json's start_url now points there).
       A visitor who has already installed the app never sees this page
       again anyway (their home-screen icon launches straight into
       app.html). See netlify.toml/service-worker.js comments for how the
       two files' roles were split during the Zettacard rebrand.

       2026-08-06: extended from a DE/EN-only toggle to all 12 of the app's
       languages (LANDING_STRINGS below), on explicit request, since the
       earlier DE/EN-only scoping read as a real gap once the rest of the
       app had full 12-locale coverage. Deliberately still self-contained -
       no dependency on app.js's i18n machinery or on fetching modules.json
       at runtime - module names/subtitles below are copied verbatim from
       the already-translated, already-verified app/data/modules.json
       (not re-translated from scratch) so this page can't drift out of
       sync with the app's own wording for those particular strings. -->
  <link rel="stylesheet" href="styles.css" />
  <script>
    // Same theme-flash-prevention approach as app.html (same key,
    // "dn-theme," same styles.css tokens) - kept here too, even though this
    // page never shows an install prompt, because the landing page reuses
    // the app's exact visual system and should honor the same saved
    // light/dark preference without its own flash of the wrong theme.
    (function () {
      try {
        var saved = localStorage.getItem("dn-theme");
        var theme = saved || (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
        document.documentElement.setAttribute("data-theme", theme);
      } catch (e) { /* storage/matchMedia unavailable - default dark styling still applies */ }
    })();
  </script>
  <style>
    /* Landing-page-only layout. Colors/typography intentionally come from
       styles.css's existing tokens (loaded above) so this page looks like
       the same product as app.html, not a different design language - only
       structure/spacing rules specific to this page's sections live here. */
    .hero {
      max-width: 720px;
      margin: 0 auto;
      padding: 48px 20px 24px;
      text-align: center;
    }
    .hero-logo {
      width: 96px;
      height: 96px;
      margin: 0 auto 20px;
      display: block;
      border-radius: var(--radius);
    }
    .hero h1 {
      font-size: 2rem;
      margin: 0 0 10px;
      letter-spacing: -0.02em;
    }
    .hero p.lede {
      color: var(--text-dim);
      font-size: 1.05rem;
      line-height: 1.5;
      max-width: 560px;
      margin: 0 auto 28px;
    }
    .cta-row {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 8px;
    }
    .cta-btn {
      display: inline-block;
      background: var(--accent);
      color: #fff;
      font-weight: 700;
      font-size: 1rem;
      text-decoration: none;
      padding: 14px 28px;
      border-radius: 999px;
      min-height: 44px;
      line-height: 1.6;
    }
    .cta-btn:hover, .cta-btn:focus-visible { filter: brightness(1.08); }
    .lang-toggle {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 6px;
      margin-bottom: 8px;
    }
    /* Reuses the exact same "🌐 icon + native-endonym <select>" pattern as
       app.html's own language pickers (lang-select-wrap/lang-icon/
       lang-select classes, styled by the shared styles.css), so this page's
       picker looks and behaves identically to the app's - not a bespoke
       second design for the same concept. */
    .lang-select-wrap select {
      min-width: 160px;
    }
    .features {
      max-width: 720px;
      margin: 0 auto;
      padding: 8px 20px 8px;
    }
    .features ul {
      list-style: none;
      margin: 0;
      padding: 0;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 10px;
    }
    .features li {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px 14px;
      font-size: 0.88rem;
    }
    .modules {
      max-width: 720px;
      margin: 0 auto;
      padding: 32px 20px 8px;
    }
    .modules h2 {
      font-size: 1.15rem;
      margin: 0 0 14px;
      text-align: center;
    }
    /* DN-55: module grid reorganized into 3 labeled groups (driving/
       leisure, workplace compliance, enterprise) instead of one flat list -
       both a content fix (surfaces all 11 modules instead of the 8 that
       were hardcoded before) and a readability improvement once the count
       grew past what one undifferentiated grid can present clearly. */
    .module-group { margin-bottom: 22px; }
    .module-group:last-child { margin-bottom: 0; }
    .module-group-heading {
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-dim);
      margin: 0 0 10px;
    }
    /* DN-57: legal-review disclaimer for the "Betriebliche Pflichtschulungen"
       group - only rendered when a group object carries a `disclaimer`
       string (see the groups.forEach() below), so this stays a no-op for
       the other two groups. */
    .module-group-disclaimer {
      font-size: 0.72rem;
      color: var(--text-dim);
      line-height: 1.45;
      margin: -4px 0 10px;
    }
    .module-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 10px;
    }
    .module-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 16px;
      font-size: 0.9rem;
    }
    .module-card strong { display: block; margin-bottom: 2px; }
    .module-card span { color: var(--text-dim); font-size: 0.8rem; }

    /* DN-55: enterprise/B2B callout - a visually distinct section (accent
       border + tinted background, vs. the plain --card used everywhere
       else on this page) placed after the hero/features and before the
       full module grid, since it's a conversion-focused pitch at a
       specific buyer (banks/corporates), not just another content list
       item. The three modules it highlights (kyc_aml, kartellrecht, lksg
       since DN-64) still also appear in the regular module grid below under
       "For enterprises" - this section exists in addition to that, not
       instead of it. */
    .enterprise {
      max-width: 720px;
      margin: 8px auto 0;
      padding: 0 20px;
    }
    .enterprise-card {
      background: linear-gradient(135deg, var(--card) 0%, var(--card) 60%, var(--accent-dim) 220%);
      border: 1px solid var(--accent-dim);
      border-radius: var(--radius);
      padding: 24px 22px;
    }
    .enterprise-badge {
      display: inline-block;
      background: var(--accent);
      color: #fff;
      font-size: 0.68rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 3px 9px;
      border-radius: 999px;
      margin-bottom: 10px;
    }
    .enterprise-card h2 {
      font-size: 1.25rem;
      margin: 0 0 8px;
    }
    .enterprise-card > p {
      color: var(--text-dim);
      font-size: 0.92rem;
      line-height: 1.5;
      margin: 0 0 18px;
      max-width: 560px;
    }
    .enterprise-modules {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 12px;
      margin-bottom: 18px;
    }
    .enterprise-module-card {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 16px;
    }
    .enterprise-module-card strong { display: block; margin-bottom: 4px; font-size: 0.98rem; }
    .enterprise-module-card p { margin: 0 0 12px; color: var(--text-dim); font-size: 0.82rem; line-height: 1.45; }
    .enterprise-module-card .cta-btn { display: inline-block; font-size: 0.85rem; padding: 8px 16px; }
    .enterprise-disclaimer {
      text-align: center;
      color: var(--text-dim);
      font-size: 0.72rem;
      margin: 0;
    }
    .contact-section {
      max-width: 480px;
      margin: 48px auto 0;
      padding: 0 20px;
      text-align: center;
    }
    .contact-section h2 { margin: 0 0 8px; font-size: 1.2rem; }
    .contact-section > p { margin: 0 0 20px; color: var(--text-dim); font-size: 0.88rem; }
    #contact-form { display: flex; flex-direction: column; gap: 10px; text-align: left; }
    #contact-form label { font-size: 0.78rem; font-weight: 600; color: var(--text-dim); }
    #contact-form input[type="text"],
    #contact-form input[type="email"],
    #contact-form textarea {
      font: inherit;
      font-size: 0.9rem;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--bg, transparent);
      color: inherit;
      width: 100%;
      box-sizing: border-box;
      resize: vertical;
    }
    /* Honeypot: visually hidden but still present/focusable-by-bots in the
       DOM, unlike display:none/hidden which some scraping bots skip past
       specifically because it's a well-known anti-bot signal - this uses
       an off-screen position instead, a technique most simple bots still
       fall for. */
    .contact-hp {
      position: absolute !important;
      left: -9999px !important;
      width: 1px; height: 1px;
      opacity: 0;
    }
    #contact-send-btn {
      align-self: flex-start;
      font-size: 0.9rem;
      padding: 10px 18px;
      border-radius: 8px;
      border: none;
      background: var(--accent, #2c4a86);
      color: #fff;
      cursor: pointer;
    }
    #contact-send-btn:disabled { opacity: 0.6; cursor: default; }
    .contact-status { margin: 4px 0 0; font-size: 0.82rem; min-height: 1.2em; }
    .contact-status-ok { color: var(--green, #3a9d5c); }
    .contact-status-error { color: var(--red, #d9534f); }
    footer.landing-footer {
      text-align: center;
      color: var(--text-dim);
      font-size: 0.78rem;
      padding: 0 20px 40px;
    }
    footer.landing-footer p { margin: 0 0 8px; }
    .legal-links a {
      color: var(--text-dim);
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <main>
    <section class="hero">
      <img class="hero-logo" src="icons/logo.svg" alt="Zettacard logo" width="96" height="96" />
      <h1>Zettacard</h1>
      <p class="lede" id="lede"></p>
      <div class="cta-row">
        <a class="cta-btn" id="cta-btn" href="./app.html"></a>
      </div>
      <div class="lang-toggle">
        <div class="lang-select-wrap">
          <span class="lang-icon" aria-hidden="true">🌐</span>
          <select class="lang-select" id="lang-select">
            <option value="de">🇩🇪 Deutsch</option>
            <option value="en">🇬🇧 English</option>
            <option value="uk">🇺🇦 Українська</option>
            <option value="pl">🇵🇱 Polski</option>
            <option value="ar">🇸🇦 العربية</option>
            <option value="zh">🇨🇳 简体中文</option>
            <option value="hi">🇮🇳 हिन्दी</option>
            <option value="tr">🇹🇷 Türkçe</option>
            <option value="fr">🇫🇷 Français</option>
            <option value="ru">🇷🇺 Русский</option>
            <option value="es">🇪🇸 Español</option>
            <option value="it">🇮🇹 Italiano</option>
          </select>
        </div>
      </div>
    </section>

    <section class="features">
      <ul id="features-list"></ul>
    </section>

    <section class="enterprise">
      <div class="enterprise-card">
        <span class="enterprise-badge" id="enterprise-badge"></span>
        <h2 id="enterprise-heading"></h2>
        <p id="enterprise-intro"></p>
        <div class="enterprise-modules">
          <div class="enterprise-module-card">
            <strong id="enterprise-kyc-title"></strong>
            <p id="enterprise-kyc-desc"></p>
            <a class="cta-btn" id="enterprise-cta-kyc" href="./app.html?exam=kyc_aml&amp;scope=ALL"></a>
          </div>
          <div class="enterprise-module-card">
            <strong id="enterprise-kartell-title"></strong>
            <p id="enterprise-kartell-desc"></p>
            <a class="cta-btn" id="enterprise-cta-kartell" href="./app.html?exam=kartellrecht&amp;scope=ALL"></a>
          </div>
          <!-- DN-64: 3rd enterprise module card - LkSG (Lieferkettengesetz).
               Same pattern as the kyc/kartell cards above. -->
          <div class="enterprise-module-card">
            <strong id="enterprise-lksg-title"></strong>
            <p id="enterprise-lksg-desc"></p>
            <a class="cta-btn" id="enterprise-cta-lksg" href="./app.html?exam=lksg&amp;scope=ALL"></a>
          </div>
        </div>
        <!-- DN-59: the "not a substitute for individual legal advice"
             disclaimer paragraph that used to render here has been removed
             per PO decision - it belongs in the Terms & Conditions (AGB) if
             anywhere, not the landing page. See render() below: the
             ENTERPRISE_STRINGS[lang].disclaimer text itself is left in
             place (unused) rather than deleted from all 12 locale objects,
             in case AGB copy is drafted from it later. -->
      </div>
    </section>

    <section class="modules">
      <h2 id="modules-heading"></h2>
      <div id="module-groups"></div>
    </section>

    <!-- DN-61: contact form - sends via the same Resend-backed Netlify
         Function infrastructure as the certificate-email feature (see
         netlify/functions/send-contact-message.mjs). A plain mailto: link
         already exists on the Impressum page (contact@zettacard.de) - this
         adds a lower-friction in-page alternative, particularly relevant
         for the Enterprise/B2B section right above (banks/large orgs asking
         about the KYC/AML or Kartellrecht pilots) without requiring the
         visitor to leave the page or have a local mail client configured. -->
    <section class="contact-section">
      <h2 id="contact-heading"></h2>
      <p id="contact-intro"></p>
      <form id="contact-form" novalidate>
        <label id="contact-name-label" for="contact-name"></label>
        <input type="text" id="contact-name" name="name" maxlength="200">
        <label id="contact-email-label" for="contact-email"></label>
        <input type="email" id="contact-email" name="email" required maxlength="200">
        <label id="contact-message-label" for="contact-message"></label>
        <textarea id="contact-message" name="message" required maxlength="4000" rows="5"></textarea>
        <!-- Honeypot field: hidden from real visitors via CSS, never
             legitimately filled in by a human - a non-empty value here is
             a strong bot signal the function checks server-side. Not a
             replacement for real spam defenses, just a cheap first filter
             that stops the most naive submission bots. -->
        <input type="text" id="contact-hp" name="hp_website" class="contact-hp" tabindex="-1" autocomplete="off">
        <button type="submit" id="contact-send-btn"></button>
        <p id="contact-status" class="contact-status" role="status" aria-live="polite"></p>
      </form>
    </section>
  </main>

  <footer class="landing-footer">
    <p id="landing-footer"></p>
    <nav class="legal-links" id="legal-links">
      <a href="./impressum.html" id="legal-link-impressum"></a>
      <span aria-hidden="true"> · </span>
      <a href="./datenschutzerklaerung.html" id="legal-link-privacy"></a>
      <span aria-hidden="true"> · </span>
      <a href="./legal/trademarks.html" id="legal-link-trademarks"></a>
      <span aria-hidden="true"> · </span>
      <a href="./legal/quellen.html" id="legal-link-quellen"></a>
    </nav>
  </footer>

  <script>
    (function () {
      // Module names/subtitles are copied verbatim from the already-
      // translated, already-verified app/data/modules.json (fuehrerschein's
      // "B" class-option label reused as its subtitle) rather than
      // re-translated here, so this page can't silently drift from the
      // app's own wording for the same concepts.
      var MODULE_LABELS = {
        fuehrerschein: {de:"Führerschein",en:"Driving licence",uk:"Посвідчення водія",pl:"Prawo jazdy",ar:"رخصة القيادة",zh:"驾驶执照",hi:"ड्राइविंग लाइसेंस",tr:"Sürücü belgesi",fr:"Permis de conduire",ru:"Водительские права",es:"Permiso de conducir",it:"Patente di guida"},
        motorrad: {de:"Motorrad",en:"Motorcycle",uk:"Мотоцикл",pl:"Motocykl",ar:"دراجة نارية",zh:"摩托车",hi:"मोटरसाइकिल",tr:"Motosiklet",fr:"Moto",ru:"Мотоцикл",es:"Motocicleta",it:"Motociclo"},
        lkw: {de:"LKW",en:"Truck",uk:"Вантажівка",pl:"Ciężarówka",ar:"شاحنة",zh:"卡车",hi:"ट्रक",tr:"Kamyon",fr:"Poids lourd",ru:"Грузовик",es:"Camión",it:"Camion"},
        angelschein: {de:"Angelschein",en:"Fishing licence",uk:"Посвідчення рибалки",pl:"Karta wędkarska",ar:"رخصة الصيد",zh:"钓鱼证",hi:"मछली पकड़ने का लाइसेंस",tr:"Balıkçılık belgesi",fr:"Permis de pêche",ru:"Удостоверение рыболова",es:"Licencia de pesca",it:"Licenza di pesca"},
        datenschutz: {de:"Datenschutz",en:"Data protection",uk:"Захист даних",pl:"Ochrona danych",ar:"حماية البيانات",zh:"数据保护",hi:"डेटा सुरक्षा",tr:"Veri koruma",fr:"Protection des données",ru:"Защита данных",es:"Protección de datos",it:"Protezione dei dati"},
        // 2026-08-17: fadp_ch (Swiss revDSG/nDSG). Label copied verbatim from
        // data/modules_manifest.json, same rule as every entry here. Sits next
        // to datenschutz because the two are cross-linked sibling modules
        // (EU GDPR/BDSG vs. Swiss revDSG) - deliberately NOT merged.
        fadp_ch: {de:"Schweizer Datenschutz (revDSG)",en:"Swiss data protection (revFADP)",uk:"Захист даних у Швейцарії (revFADP)",pl:"Szwajcarska ochrona danych (revFADP)",ar:"حماية البيانات السويسرية (revFADP)",zh:"瑞士数据保护法 (revFADP)",hi:"स्विस डेटा सुरक्षा (revFADP)",tr:"İsviçre veri koruma mevzuatı (revFADP)",fr:"Protection des données en Suisse (nLPD)",ru:"Защита данных в Швейцарии (revFADP)",es:"Protección de datos en Suiza (revFADP)",it:"Protezione dei dati in Svizzera (revFADP)"},

          if (group.disclaimer) {
            var disclaimerP = document.createElement("p");
            disclaimerP.className = "module-group-disclaimer";
            disclaimerP.textContent = group.disclaimer;
            groupEl.appendChild(disclaimerP);
          }
          var gridEl = document.createElement("div");
          gridEl.className = "module-grid";
          group.mods.forEach(function (mod) {
            var name = (MODULE_LABELS[mod] && (MODULE_LABELS[mod][lang] || MODULE_LABELS[mod].en)) || mod;
            var card = document.createElement("div");
            card.className = "module-card";
            var strong = document.createElement("strong");
            strong.textContent = name;
            card.appendChild(strong);
            if (subtitles[mod]) {
              var span = document.createElement("span");
              span.textContent = subtitles[mod];
              card.appendChild(span);
            }
            gridEl.appendChild(card);
          });
          groupEl.appendChild(gridEl);
          groupsEl.appendChild(groupEl);
        });

        // DN-61: contact form strings. Re-rendered on every lang switch
        // like everything else on this page - contact-status is left
        // untouched here (not reset to "") so a visitor who already got a
        // "sent"/error message and then switches languages mid-read still
        // sees it, just no longer translated - acceptable since re-doing
        // the send() themselves would refresh it anyway.
        var cs = CONTACT_STRINGS[lang] || CONTACT_STRINGS.en;
        document.getElementById("contact-heading").textContent = cs.heading;
        document.getElementById("contact-intro").textContent = cs.intro;
        document.getElementById("contact-name-label").textContent = cs.nameLabel;
        document.getElementById("contact-name").setAttribute("placeholder", cs.namePlaceholder);
        document.getElementById("contact-email-label").textContent = cs.emailLabel;
        document.getElementById("contact-email").setAttribute("placeholder", cs.emailPlaceholder);
        document.getElementById("contact-message-label").textContent = cs.messageLabel;
        document.getElementById("contact-message").setAttribute("placeholder", cs.messagePlaceholder);
        document.getElementById("contact-send-btn").textContent = cs.sendBtn;

        document.getElementById("lang-select").value = lang;
      }

      var startLang = detectLang();
      render(startLang);

      document.getElementById("lang-select").addEventListener("change", function (e) {
        var lang = e.target.value;
        try { localStorage.setItem(STORAGE_KEY, lang); } catch (e2) { /* storage unavailable, non-fatal */ }
        render(lang);
      });

      // DN-61: contact form submit. Mirrors app.js's renderEmailCertRow()
      // pattern (disable-while-sending, show a success/error message) but
      // lives here rather than in app.js since the landing page is a
      // separate, standalone HTML document with its own inline script - not
      // something that shares app.js's module-loading/state at all.
      var CONTACT_ENDPOINT = "/.netlify/functions/send-contact-message";
      document.getElementById("contact-form").addEventListener("submit", function (e) {
        e.preventDefault();
        var cs = CONTACT_STRINGS[currentLang] || CONTACT_STRINGS.en;
        var statusEl = document.getElementById("contact-status");
        var btn = document.getElementById("contact-send-btn");
        var nameEl = document.getElementById("contact-name");
        var emailEl = document.getElementById("contact-email");
        var messageEl = document.getElementById("contact-message");
        var hpEl = document.getElementById("contact-hp");

        if (!emailEl.checkValidity() || !messageEl.checkValidity()) {
          emailEl.reportValidity();
          return;
        }

        btn.disabled = true;
        statusEl.textContent = cs.sending;
        statusEl.className = "contact-status";

        fetch(CONTACT_ENDPOINT, {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({
            name: nameEl.value.trim(),
            email: emailEl.value.trim(),
            message: messageEl.value.trim(),
            lang: currentLang,
            hp_website: hpEl.value,
          }),
        })
          .then(function (res) { return res.ok; })
          .catch(function () { return false; })
          .then(function (ok) {
            btn.disabled = false;
            statusEl.textContent = ok ? cs.sentMsg : cs.errorMsg;
            statusEl.className = ok ? "contact-status contact-status-ok" : "contact-status contact-status-error";
            if (ok) {
              nameEl.value = "";
              emailEl.value = "";
              messageEl.value = "";
            }
          });
      });
    })();
  </script>
</body>
</html>
